name: Update Iran Commits rank

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-committers-rank

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
      - name: Sync the profile badge
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 20 \
            https://committers.top/rank_only/iran.json -o "$RUNNER_TEMP/iran-rank.json"

          python3 - "$RUNNER_TEMP/iran-rank.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          ranks = json.loads(Path(sys.argv[1]).read_bytes())["user"]
          if not isinstance(ranks, list) or not ranks:
              raise SystemExit("Expected a non-empty Iran Commits ranking")
          rank = next(
              (number for number, login in enumerate(ranks, 1)
               if login.casefold() == "arminazimi"),
              None,
          )

          readme = Path("README.md")
          original = readme.read_bytes()
          pattern = (
              rb"(https://img\.shields\.io/badge/Committers\.top-)"
              rb"(?:%23[1-9][0-9]*|Unranked)(%20Iran-)"
          )
          label = f"%23{rank}".encode() if rank is not None else b"Unranked"
          updated, matches = re.subn(
              pattern, lambda match: match[1] + label + match[2], original
          )
          if matches != 1:
              raise SystemExit("Expected exactly one Committers.top Iran badge in README.md")
          if updated != original:
              readme.write_bytes(updated)
          PY

          if git diff --quiet -- README.md; then
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update Iran Commits rank badge' -- README.md
          git push
